      function runFlatPickr() {
        $("#dateTimePicker").flatpickr({
          enableTime: true,
          time_24hr: true,
          minDate: new Date().fp_incr(1),
          maxDate: new Date().fp_incr(60),
          placeholder: 'adws',
          dateFormat: "d/m/Y H:i",
          "disable": [
              function(date) {
                return (date.getDay() === 0 || date.getDay() === 6);  // disable weekends
              }
          ],
          "locale": {
              "firstDayOfWeek": 1 // set start day of week to Monday
          }
        });
      }

      function reRunSlick() {
        destroySlick();
        runSlick();
      }

      function destroySlick() {
        //console.log('destroySlick() called...');

        if ($(".banners").hasClass('slick-initialized')) {
          $(".banners").slick('destroy');
          //console.log('destroyed for banners');
        }

        if ($(".brands").hasClass('slick-initialized')) {
          $(".brands").slick('destroy');
          //console.log('destroyed for brands');
        }

        if ($(".products").hasClass('slick-initialized')) {
          $(".products").slick('destroy');
          //console.log('destroyed for products');
        }

        if ($(".tryOn").hasClass('slick-initialized')) {
          $(".tryOn").slick('destroy');
          //console.log('destroyed for tryOn');
        }

        if ($(".slogans").hasClass('slick-initialized')) {
          $(".slogans").slick('destroy');
          //console.log('destroyed for slogans');
        }
      }

      function runSlick() {
        //console.log('runSlick() called...');
        $(".banners").slick({
          autoplay: false,
          autoplayspeed: 15000,
          centerMode: false,
          centerPadding: '0px',
          slidesToShow: 1,
          slidesToScroll: 1,
          fade: false,
          arrows: true,
          dots: true,
          swipeToSlide: true,
          focusOnSelect: true,
          responsive: [
            {
              breakpoint: 768,
              settings: {
                arrows: true,
                centerMode: false,
                centerPadding: '0px',
                slidesToShow: 1
              }
            },
            {
              breakpoint: 430,
              settings: {
                centerMode: false,
                centerPadding: '20px',
                dots: false,
                arrows: false,
                slidesToShow: 1
              }
            }
          ]
        });

        $(".brands").slick({
          autoplay: true,
          autoplayspeed: 5000,
          centerMode: false,
          centerPadding: '90px',
          slidesToShow: 3,
          slidesToScroll: 3,
          fade: false,
          arrows: true,
          dots: false,
          rtl: true,
          responsive: [
            {
              breakpoint: 768,
              settings: {
                arrows: true,
                centerMode: true,
                centerPadding: '20px',
                slidesToShow: 3
              }
            },
            {
              breakpoint: 430,
              settings: {
                arrows: false,

                slidesToShow: 1

        $(".tryOn").slick({

          autoplayspeed: 25000,
          dots: false,
          infinite: true,
          fade: false,
