<div class="app-top-bar">
  <div class="topBarContainer">
    <div class="logo">
      <a (click)="goToUrl('/home')">
        <h1>Prestige Optics</h1><br />
        <h5>Designs & Innovations</h5>
      </a>
    </div>

    <div class="topBarActions">
      <div class="themeMenu">
        <button
          type="button"
          class="themeMenuBtn"
          (click)="toggleThemeMenu($event)"
          [attr.aria-expanded]="themeMenuOpen"
          aria-haspopup="menu"
          title="Theme"
        >
          <i class="material-icons">{{ themeIcon }}</i>
          <i class="material-icons themeChevron">expand_more</i>
        </button>

        <div class="themeDropdown" *ngIf="themeMenuOpen" role="menu">
          <button
            type="button"
            class="themeOption"
            *ngFor="let option of themeOptions"
            role="menuitemradio"
            [attr.aria-checked]="themeMode === option.mode"
            [class.active]="themeMode === option.mode"
            (click)="selectThemeMode(option.mode, $event)"
          >
            <i class="material-icons">{{ option.icon }}</i>
            <span>{{ option.label }}</span>
          </button>
        </div>
      </div>

      <a
        id="cartButton"
        class="cartBtn button fancy-button btnVisible"
        routerLink="/cart"
        style="visibility: visible"
      >
        <i class="material-icons">shopping_cart</i
        ><span class="checkout" hidden>{{ 'Checkout' | translate }}</span>
        &nbsp;<span class="itemsCnt" *ngIf="itemsCnt > 0">{{ itemsCnt }}</span>
      </a>
    </div>

    <div class="contactContainer">
      <div
        *ngFor="let contact of contactInfoFiltered | slice: 0 : 1; let l = index"
        class="contactBox"
      >
        <div *ngFor="let contDet of contact.location; let i = index">
          <a
            *ngIf="contact.location[i].contactType == 'Email'"
            href="mailto:{{ contact.location[i].contactValue }}"
          >
            <i class="material-icons">email</i>
          </a>
          <a
            *ngIf="contact.location[i].contactType == 'Phone Number'"
            href="tel:{{ contact.location[i].contactValue }}"
          >
            <i class="material-icons">phone</i>
          </a>
          <a
            *ngIf="contact.location[i].contactType == 'Facebook'"
            href="{{ contact.location[i].contactValue }}"
            target="_blank"
          >
            <i class="material-icons">facebook</i>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
